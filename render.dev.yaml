services:
  - type: web
    name: strive-api-dev
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    branch: main
    envVars:
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: strive-api
      - key: JWT_AUDIENCE
        value: strive-app
      - key: JWT_CLOCK_SKEW
        value: 2m
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-dev-frontend.com,http://localhost:3000,http://localhost:4200
      - key: CORS_ALLOWED_METHODS
        value: GET,POST,PUT,DELETE,OPTIONS
      - key: CORS_ALLOWED_HEADERS
        value: Accept,Authorization,Content-Type,X-Request-ID
      - key: CORS_EXPOSED_HEADERS
        value: X-Request-ID
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: CORS_MAX_AGE
        value: 86400
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "None"
      - key: COOKIE_DOMAIN
        value: ""
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: 10
      - key: RATE_LIMIT_GENERAL_PER_MINUTE
        value: 100
      - key: RATE_LIMIT_BURST_SIZE
        value: 20
      - key: EXERCISEDB_ENABLED
        value: "true"
      - key: EXERCISEDB_BASE_URL
        value: https://exercise.hellogym.io
      - key: EXERCISEDB_TIMEOUT
        value: 30s
      - key: EXERCISEDB_RETRY_COUNT
        value: 3
